services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      args:
        PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
        PRELOAD_VOICE: ${PRELOAD_VOICE:-true}
    container_name: bookshelf-backend
    ports:
      - "${BACKEND_PORT:-5002}:5002"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      STORAGE_DIR: /app/storage
      PIPER_VOICES_DIR: /app/voices
      TTS_BACKEND: ${TTS_BACKEND:-local}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      TTS_WORKERS: ${TTS_WORKERS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      - bookshelf_storage:/app/storage
      - bookshelf_voices:/app/voices
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bookshelf_storage:
  bookshelf_voices:
